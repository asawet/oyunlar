<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SavetCraft — Yapımcı: ABDULSAMET</title>
  <meta name="theme-color" content="#15211f">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23855b42'/%3E%3Crect width='16' height='6' fill='%235caa56'/%3E%3C/svg%3E">
  <!-- Offline list read by the hub service worker: href="Build/WebGL.data.unityweb" href="Build/WebGL.framework.js.unityweb" href="Build/WebGL.wasm.unityweb" href="Build/WebGL.loader.js" -->
  <style>
    :root { --ink: #eef3ef; --muted: #9fb2ad; --accent: #ffbd47; --ground: #15211f; --track: #2b3b39; --danger: #ff7a68; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
    #unity-canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; outline: none; background: var(--ground); }
    #unity-loading-bar { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 max(32px, 12vw); background: var(--ground); color: var(--ink); font-family: "Courier New", monospace; }
    #title { margin: 0; color: var(--accent); font-size: clamp(36px, 7vw, 72px); font-weight: 700; letter-spacing: .08em; }
    #subtitle { margin: 8px 0 40px; color: var(--muted); font-size: 16px; letter-spacing: .12em; }
    #track { width: min(520px, 100%); height: 12px; background: var(--track); }
    #fill { width: 0; height: 100%; background: var(--accent); transition: width .15s linear; }
    #credit { position: fixed; left: max(32px, 12vw); bottom: 32px; margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .1em; }
    #error { display: none; margin: 24px 0 0; max-width: 620px; color: var(--danger); font-size: 15px; line-height: 1.5; }
    #hub-back { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 20; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid rgba(255, 189, 71, .55); border-radius: 8px; background: rgba(13, 22, 21, .86); color: var(--ink); font: 700 13px system-ui, sans-serif; text-decoration: none; }
    #hub-back:hover, #hub-back:focus-visible { background: #24332f; border-color: var(--accent); outline: none; }
    body.playing #hub-back { display: none; }
    #device-note { display: none; margin: 18px 0 0; color: var(--accent); font-size: 14px; line-height: 1.5; }
    @media (hover: none) and (pointer: coarse) { #device-note { display: block; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <a id="hub-back" href="../../">← Oyunlara dön</a>
  <div id="unity-loading-bar" role="status">
    <h1 id="title">SAVETCRAFT</h1>
    <p id="subtitle">DÜNYA HAZIRLANIYOR</p>
    <div id="track"><div id="fill"></div></div>
    <p id="device-note">Bu oyun klavye ve fare ile oynanır.</p>
    <p id="error"></p>
    <p id="credit">YAPIMCI: ABDULSAMET</p>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#unity-loading-bar");
    const fill = document.querySelector("#fill");
    const error = document.querySelector("#error");

    // The way back to the game center stays out of sight while the mouse is captured for play.
    document.addEventListener("pointerlockchange", () => document.body.classList.toggle("playing", document.pointerLockElement === canvas));

    // Browsers may refuse pointer lock. Unity would treat that rejection as a fatal error and freeze the game.
    const requestLock = Element.prototype.requestPointerLock;
    Element.prototype.requestPointerLock = function (...args) {
      try {
        const result = requestLock.apply(this, args);
        return result && result.catch ? result.catch(reason => console.warn("Pointer lock refused:", reason.name)) : result;
      } catch (reason) {
        console.warn("Pointer lock refused:", reason.name);
        return Promise.resolve();
      }
    };

    // Right mouse places blocks, so the browser menu must stay closed.
    canvas.addEventListener("contextmenu", event => event.preventDefault());
    window.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code.startsWith("Arrow")) event.preventDefault();
    });

    function showError(message) {
      error.style.display = "block";
      error.textContent = "Oyun açılamadı. Tarayıcın WebGL 2 destekliyor mu kontrol et. " + message;
    }

    const script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onerror = () => showError("Oyun dosyaları yüklenemedi.");
    script.onload = () => {
      createUnityInstance(canvas, {
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Abdulsamet",
        productName: "SavetCraft",
        productVersion: "0.1.0",
        devicePixelRatio: 1,
      }, progress => {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(() => {
        loading.style.display = "none";
        canvas.focus();
      }).catch(message => showError(String(message)));
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
